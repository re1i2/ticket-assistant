[project]
name = "ticket-assistant"
version = "1.0.0"
description = "Intelligent Support Ticket Assistant (English + Arabic): classify, retrieve, draft grounded replies"
requires-python = ">=3.10,<3.14"
dependencies = [
    "torch>=2.4", "transformers>=4.56", "accelerate>=1.0", "sentence-transformers>=3.2", "datasets>=3.0",
    "faiss-cpu>=1.8", "rank-bm25>=0.2.2", "scikit-learn>=1.5", "pandas>=2.2", "numpy>=1.26", "pydantic>=2.7",
    "pyyaml>=6.0", "openai>=1.50", "python-dotenv>=1.0", "sentencepiece>=0.2", "protobuf>=4.25", "gradio>=5.0",
]

[tool.uv]
package = false
